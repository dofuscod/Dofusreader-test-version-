<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dofus Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { background-color: #0d0d0d; color: #d4d4d4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: flex; flex-direction: column; }
        .word { cursor: pointer; border-bottom: 1px dotted #555; }
        .word-known { color: #888; border-bottom: none; opacity: 0.6; }
        .word:active { background-color: rgba(255, 255, 255, 0.1); }
        .sentence-block { margin-bottom: 1.5rem; }
        .translation-text { font-size: 0.9em; margin-bottom: 0.2rem; color: #a3a3a3; line-height: 1.4; }
        .original-text { line-height: 1.6; color: #f3f3f3; }
        .nav-btn.active { color: #fff; border-bottom: 2px solid #fff; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <div class="flex-1 flex flex-col max-w-2xl w-full mx-auto p-4">

        <!-- ВЕРХНЯЯ НАВИГАЦИЯ (ВКЛАДКИ) -->
        <header id="main-nav" class="flex justify-between items-center border-b border-zinc-800 pb-3 mb-4 text-sm">
            <div class="flex gap-4">
                <button onclick="switchTab('library')" id="btn-library" class="nav-btn active pb-1 text-zinc-400 hover:text-zinc-200 transition">Библиотека</button>
                <button onclick="switchTab('dictionary')" id="btn-dictionary" class="nav-btn pb-1 text-zinc-400 hover:text-zinc-200 transition">Словарь</button>
            </div>
            <span id="dict-counter" class="text-xs text-zinc-500">Словарь: 0</span>
        </header>

        <!-- ВКЛАДКА 1: БИБЛИОТЕКА -->
        <div id="tab-library" class="tab-content active space-y-6">
            <div class="border border-zinc-800 p-4 rounded-lg bg-zinc-900/50">
                <h2 class="text-xs font-medium uppercase tracking-wider text-zinc-400 mb-3">Импорт книги</h2>
                <input type="file" id="epub-input" accept=".epub,application/epub+zip,*/*" class="block w-full text-xs text-zinc-400 file:mr-3 file:py-2 file:px-3 file:rounded file:border-0 file:text-xs file:font-medium file:bg-zinc-800 file:text-zinc-200 hover:file:bg-zinc-700 cursor-pointer">
                <p id="loading-text" class="text-xs text-zinc-400 mt-2 hidden">Обработка файла...</p>
            </div>

            <div>
                <h2 class="text-xs font-medium uppercase tracking-wider text-zinc-400 mb-3">Ваши книги</h2>
                <div id="books-list" class="space-y-2"></div>
            </div>
        </div>

        <!-- ВКЛАДКА 2: СЛОВАРЬ (ОТДЕЛЬНЫЙ ЭКРАН) -->
        <div id="tab-dictionary" class="tab-content space-y-6">
            <div class="border border-zinc-800 p-4 rounded-lg bg-zinc-900/50 space-y-4">
                <h2 class="text-xs font-medium uppercase tracking-wider text-zinc-400">Резервная копия словаря</h2>
                <div class="flex gap-2">
                    <button onclick="exportJSON()" class="flex-1 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs rounded transition">Скачать JSON</button>
                    <label class="flex-1 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs rounded text-center cursor-pointer transition">
                        Загрузить JSON
                        <input type="file" id="json-input" accept=".json" class="hidden" onchange="importJSON(event)">
                    </label>
                </div>
            </div>

            <div class="border border-zinc-800 p-4 rounded-lg bg-zinc-900/50 space-y-3">
                <h2 class="text-xs font-medium uppercase tracking-wider text-zinc-400">Добавить слова текстом</h2>
                <textarea id="dict-import-text" rows="3" class="w-full text-xs p-2 rounded bg-zinc-950 border border-zinc-800 text-zinc-200" placeholder="слово1, слово2..."></textarea>
                <button onclick="importUserDictionaryText()" class="w-full py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs rounded transition">Добавить в словарь</button>
            </div>
        </div>

        <!-- ЭКРАН ЧИТАЛКИ (ОТКРЫВАЕТСЯ ПРИ КЛИКЕ НА КНИГУ) -->
        <div id="tab-reader" class="tab-content flex-1 flex flex-col h-full">
            <header class="sticky top-0 z-10 bg-[#0d0d0d] pb-3 border-b border-zinc-800 mb-4 flex justify-between items-center">
                <button onclick="switchTab('library')" class="text-xs text-zinc-400 hover:text-zinc-200">← Назад</button>
                <div class="flex items-center gap-3 text-xs text-zinc-400">
                    <span id="word-progress">0% знаний</span>
                    <button onclick="changeFontSize(-1)" class="px-2 py-1 bg-zinc-900 border border-zinc-800 rounded">A-</button>
                    <button onclick="changeFontSize(1)" class="px-2 py-1 bg-zinc-900 border border-zinc-800 rounded">A+</button>
                </div>
            </header>

            <div id="chapters-nav" class="flex gap-2 overflow-x-auto pb-3 mb-4 text-xs scrollbar-none"></div>

            <main id="reader-content" class="flex-1 overflow-y-auto leading-relaxed space-y-4" style="font-size: 17px;">
                <div id="sentences-container"></div>
            </main>
        </div>

    </div>

    <script>
        const db = new Dexie("DofusReaderDB_v5");
        db.version(1).stores({
            books: "++id, title, createdAt",
            chapters: "++id, bookId, order",
            dictionary: "&word",
            translations: "&hash"
        });

        let knownWordsSet = new Set();
        let currentBookId = null;
        let currentChapterId = null;
        let currentFontSize = 17;

        window.addEventListener('DOMContentLoaded', async () => {
            await reloadDictionary();
            await loadBooks();
        });

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            if (tabName === 'library' || tabName === 'dictionary') {
                document.getElementById(`tab-${tabName}`).classList.add('active');
                if(tabName !== 'reader') {
                    const btn = document.getElementById(`btn-${tabName}`);
                    if(btn) btn.classList.add('active');
                }
            } else if (tabName === 'reader') {
                document.getElementById('tab-reader').classList.add('active');
            }
        }

        async function reloadDictionary() {
            const allWords = await db.dictionary.toArray();
            knownWordsSet = new Set(allWords.map(item => item.word.toLowerCase()));
            document.getElementById('dict-counter').innerText = `Словарь: ${knownWordsSet.size}`;
        }

        async function exportJSON() {
            const allWords = await db.dictionary.toArray();
            const jsonString = JSON.stringify(allWords.map(w => w.word), null, 2);
            const blob = new Blob([jsonString], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `dofus_dictionary.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        async function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const wordsArray = JSON.parse(e.target.result);
                    if (Array.isArray(wordsArray)) {
                        const records = wordsArray.map(w => ({ word: String(w).toLowerCase().trim() })).filter(w => w.word);
                        await db.dictionary.bulkPut(records);
                        await reloadDictionary();
                        alert(`Импортировано слов: ${records.length}`);
                        if (currentChapterId) renderCurrentChapter();
                    }
                } catch (err) { alert("Ошибка JSON: " + err.message); }
            };
            reader.readAsText(file);
        }

        async function importUserDictionaryText() {
            const text = document.getElementById('dict-import-text').value;
            if (!text.trim()) return;
            const words = text.toLowerCase().split(/[\n,;]+/).map(w => w.trim()).filter(w => w.length > 0);
            await db.dictionary.bulkPut(words.map(word => ({ word })));
            await reloadDictionary();
            document.getElementById('dict-import-text').value = '';
            alert(`Добавлено слов: ${words.length}`);
            if (currentChapterId) renderCurrentChapter();
        }

        async function loadBooks() {
            const books = await db.books.toArray();
            const listEl = document.getElementById('books-list');
            if (books.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-zinc-600">Нет сохраненных книг.</p>';
                return;
            }
            listEl.innerHTML = books.map(b => `
                <div class="border border-zinc-800/80 p-3 rounded flex justify-between items-center bg-zinc-900/30">
                    <span class="text-sm text-zinc-200 cursor-pointer hover:underline" onclick="openBook(${b.id})">${b.title}</span>
                    <div class="flex items-center gap-3">
                        <button onclick="openBook(${b.id})" class="text-xs text-zinc-400 hover:text-zinc-100">Читать</button>
                        <button onclick="deleteBook(${b.id})" class="text-xs text-zinc-600 hover:text-red-400">Удалить</button>
                    </div>
                </div>
            `).join('');
        }

        async function deleteBook(bookId) {
            if (!confirm("Удалить книгу?")) return;
            await db.books.delete(bookId);
            await db.chapters.where('bookId').equals(bookId).delete();
            await loadBooks();
        }

        document.getElementById('epub-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const loadingEl = document.getElementById('loading-text');
            loadingEl.classList.remove('hidden');

            try {
                const zip = new JSZip();
                const zipContent = await zip.loadAsync(file);
                const containerFile = zipContent.file('META-INF/container.xml');
                const containerXml = await containerFile.async('text');
                const parser = new DOMParser();
                const containerDoc = parser.parseFromString(containerXml, 'text/xml');
                const opfPath = containerDoc.querySelector('rootfile')?.getAttribute('full-path');
                
                const opfFolder = opfPath.substring(0, opfPath.lastIndexOf('/') + 1);
                const opfText = await zipContent.file(opfPath).async('text');
                const opfDoc = parser.parseFromString(opfText, 'text/xml');

                const title = opfDoc.querySelector('metadata > dc\\:title, title')?.textContent || file.name;
                const bookId = await db.books.add({ title, createdAt: Date.now() });
                
                const items = Array.from(opfDoc.querySelectorAll('manifest > item'));
                const spine = Array.from(opfDoc.querySelectorAll('spine > itemref')).map(r => r.getAttribute('idref'));

                let order = 0;
                for (const idref of spine) {
                    const item = items.find(i => i.getAttribute('id') === idref);
                    if (!item) continue;
                    const htmlContent = await zipContent.file(opfFolder + item.getAttribute('href')).async('text');
                    await db.chapters.add({ bookId, order: order++, title: `Глава ${order}`, htmlContent });
                }
                await loadBooks();
            } catch (err) { alert('Ошибка импорта: ' + err.message); }
            finally { loadingEl.classList.add('hidden'); e.target.value = ''; }
        });

        async function openBook(bookId) {
            currentBookId = bookId;
            switchTab('reader');

            const chapters = await db.chapters.where('bookId').equals(bookId).sortBy('order');
            const navEl = document.getElementById('chapters-nav');

            navEl.innerHTML = chapters.map((ch, idx) => `
                <button onclick="loadChapter(${ch.id})" class="px-3 py-1 bg-zinc-900 border border-zinc-800 rounded text-zinc-300 whitespace-nowrap">
                    ${ch.title || 'Глава ' + (idx + 1)}
                </button>
            `).join('');

            if (chapters.length > 0) loadChapter(chapters[0].id);
        }

        async function loadChapter(chapterId) {
            currentChapterId = chapterId;
            await renderCurrentChapter();
        }

        async function renderCurrentChapter() {
            const chapter = await db.chapters.get(currentChapterId);
            if (!chapter) return;

            const parser = new DOMParser();
            const doc = parser.parseFromString(chapter.htmlContent, 'text/html');
            const rawText = doc.body ? doc.body.textContent : chapter.htmlContent;

            const sentences = rawText.match(/[^.!?]+[.!?]+/g) || [rawText];
            const container = document.getElementById('sentences-container');
            container.innerHTML = '';

            let totalWords = 0;
            let knownWords = 0;

            for (let i = 0; i < sentences.length; i++) {
                const origSentence = sentences[i].trim();
                if (!origSentence) continue;

                const words = origSentence.split(/(\s+|[^\w\s]+)/);
                let unknownCount = 0;

                const sentenceHtml = words.map(w => {
                    const clean = w.toLowerCase().replace(/[^a-z]/g, '');
                    if (!clean) return w;
                    totalWords++;
                    if (knownWordsSet.has(clean)) {
                        knownWords++;
                        return `<span class="word word-known" onclick="toggleWord('${clean}')">${w}</span>`;
                    } else {
                        unknownCount++;
                        return `<span class="word" onclick="toggleWord('${clean}')">${w}</span>`;
                    }
                }).join('');

                const block = document.createElement('div');
                block.className = 'sentence-block';

                // РУССКИЙ ПЕРЕВОД СВЕРХУ
                const transEl = document.createElement('div');
                transEl.className = 'translation-text';
                transEl.id = `trans-${i}`;
                transEl.innerText = "перевод...";

                const origEl = document.createElement('div');
                origEl.className = 'original-text';
                origEl.innerHTML = sentenceHtml;

                block.appendChild(transEl);
                block.appendChild(origEl);
                container.appendChild(block);

                if (unknownCount > 0) {
                    fetchTranslation(origSentence, `trans-${i}`);
                } else {
                    transEl.style.display = 'none'; // Скрываем перевод, если все слова знакомы
                }
            }

            const percent = totalWords > 0 ? Math.round((knownWords / totalWords) * 100) : 0;
            document.getElementById('word-progress').innerText = `${percent}% знаний`;
        }

        async function toggleWord(word) {
            word = word.toLowerCase();
            if (knownWordsSet.has(word)) {
                knownWordsSet.delete(word);
                await db.dictionary.where('word').equals(word).delete();
            } else {
                knownWordsSet.add(word);
                await db.dictionary.put({ word });
            }
            await reloadDictionary();
            renderCurrentChapter();
        }

        async function fetchTranslation(text, elementId) {
            const hash = btoa(unescape(encodeURIComponent(text))).slice(0, 32);
            const cached = await db.translations.get(hash);
            if (cached) {
                const el = document.getElementById(elementId);
                if (el) el.innerText = cached.translation;
                return;
            }

            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                if (data && data[0]) {
                    const translatedText = data[0].map(item => item[0]).join('');
                    if (translatedText) {
                        await db.translations.put({ hash, translation: translatedText });
                        const el = document.getElementById(elementId);
                        if (el) el.innerText = translatedText;
                        return;
                    }
                }
            } catch (e) {
                const el = document.getElementById(elementId);
                if (el) el.innerText = "—";
            }
        }

        function changeFontSize(delta) {
            currentFontSize = Math.max(13, Math.min(26, currentFontSize + delta));
            document.getElementById('reader-content').style.fontSize = currentFontSize + 'px';
        }
    </script>
</body>
</html>
